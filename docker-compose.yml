# One command to run everything:  docker compose up --build
#   web     http://localhost:3000   Next.js frontend
#   api     http://localhost:8000   Laravel REST API
#   reverb  ws://localhost:8080     Laravel Reverb WebSocket server
#
# The keys below are throwaway local-development values. Never reuse them in
# a deployment: override them through the environment or an .env file.

x-api-env: &api-env
  APP_ENV: local
  APP_DEBUG: "true"
  DB_CONNECTION: sqlite
  SESSION_DRIVER: array
  QUEUE_CONNECTION: sync
  CACHE_STORE: file
  BROADCAST_CONNECTION: reverb
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
  REVERB_APP_ID: ${REVERB_APP_ID:-kanban}
  REVERB_APP_KEY: ${REVERB_APP_KEY:-local-reverb-key}
  REVERB_APP_SECRET: ${REVERB_APP_SECRET:-local-reverb-secret}
  # How the API reaches Reverb on the compose network (server to server).
  REVERB_HOST: reverb
  REVERB_PORT: "8080"
  REVERB_SCHEME: http
  REVERB_ALLOWED_ORIGINS: ${FRONTEND_URL:-http://localhost:3000}

services:
  api:
    build: ./api
    environment:
      <<: *api-env
      RUN_MIGRATIONS: "true"
    ports:
      - "8000:8000"
    volumes:
      - api-data:/app/database
    depends_on:
      - reverb

  reverb:
    build: ./api
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080", "--no-interaction"]
    environment: *api-env
    ports:
      - "8080:8080"

  web:
    build:
      context: ./web
      args:
        # What the *browser* uses, so these point at localhost, not service names.
        NEXT_PUBLIC_API_URL: http://localhost:8000/api
        NEXT_PUBLIC_REVERB_APP_KEY: ${REVERB_APP_KEY:-local-reverb-key}
        NEXT_PUBLIC_REVERB_HOST: localhost
        NEXT_PUBLIC_REVERB_PORT: "8080"
        NEXT_PUBLIC_REVERB_SCHEME: http
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  api-data:
