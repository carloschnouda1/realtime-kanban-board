name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    name: API (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, sqlite3, pcntl
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Code style (Pint)
        run: |
          vendor/bin/pint --test --format=json > /tmp/pint.json || true
          python3 - <<'PY'
          import json, sys
          data = json.load(open('/tmp/pint.json'))
          files = data.get('files', [])
          for f in files:
              print(f"::error title=pint {f['name']}::{f.get('fixer') or f.get('appliedFixers')}")
          sys.exit(1 if files else 0)
          PY

      - name: Tests
        run: |
          set -o pipefail
          php artisan test 2>&1 | tee /tmp/tests.log || { echo "::error title=test output::$(grep -v '^\s*$' /tmp/tests.log | tail -c 5000 | sed ':a;N;$!ba;s/\n/%0A/g')"; exit 1; }

  web:
    name: Web (typecheck, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end (docker compose + WebSocket)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Start the stack
        # The Node client in the e2e script sends no Origin header, so the
        # origin allow-list is opened up for this run only.
        run: docker compose up -d --build
        env:
          REVERB_ALLOWED_ORIGINS: '*'

      - name: Install e2e dependencies
        run: npm ci
        working-directory: web

      - name: Run the realtime end-to-end check
        run: |
          set -o pipefail
          npm run e2e 2>&1 | tee /tmp/e2e.log || { echo "::error title=e2e output::$(tail -c 3000 /tmp/e2e.log | sed ':a;N;$!ba;s/\n/%0A/g')"; exit 1; }
        working-directory: web

      - name: Show container logs on failure
        if: failure()
        run: |
          for s in api reverb web; do
            out=$(docker compose logs --no-color --tail=30 $s 2>&1 | head -c 6000 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=logs $s::$out"
          done

      - name: Stop the stack
        if: always()
        run: docker compose down -v
